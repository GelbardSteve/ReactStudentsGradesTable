name: E2E Tests

# Runs on every PR into main (from any branch) and on every push to main
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the previous run
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      BASE_URL: http://localhost:3000
      API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ServerMySQL/package-lock.json
            reactApp/package-lock.json
            e2e-playwright/package-lock.json

      # Database: schema + demo data (includes the admin user from testRunData.json)
      - name: Create database
        run: |
          mysql -h 127.0.0.1 -uroot -proot < students/schema.sql
          mysql -h 127.0.0.1 -uroot -proot < students/seed.sql

      # API server on :4000 (emails are printed to the log, no RESEND_API_KEY)
      - name: Start API server
        working-directory: ServerMySQL
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: stevegel_students
          PORT: 4000
          APP_URL: http://localhost:3000
        run: |
          npm ci
          nohup node index.js > ../server.log 2>&1 &

      # React app on :3000, built against the local API
      - name: Build and serve React app
        working-directory: reactApp
        env:
          REACT_APP_API_URL: http://localhost:4000
          CI: false # CRA would otherwise fail the build on lint warnings
        run: |
          npm ci
          npm run build
          nohup python3 -m http.server 3000 --directory build > ../web.log 2>&1 &

      - name: Wait for app and API
        run: |
          for url in http://localhost:4000/classes http://localhost:3000; do
            timeout 60 bash -c "until curl -s -o /dev/null $url; do sleep 1; done" || { echo "$url is not up"; exit 1; }
          done

      - name: Install E2E dependencies
        working-directory: e2e-playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e-playwright
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx playwright test

      - name: Upload Allure report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: e2e-playwright/allure-report/
          retention-days: 14

      - name: Upload Playwright report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e-playwright/playwright-report/
            e2e-playwright/test-results/
          retention-days: 14

      - name: Server logs
        if: ${{ failure() }}
        run: |
          echo "::group::API server log"; cat server.log; echo "::endgroup::"
          echo "::group::Web server log"; cat web.log; echo "::endgroup::"
